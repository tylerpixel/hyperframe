<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperframe</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="logo">hyperframe.computer</div>

    <div class="room-code" id="roomCode">---</div>
    <div class="room-url" id="roomUrl"></div>

    <button class="btn" id="shareBtn">Share Screen</button>
    <button class="btn btn-stop hidden" id="stopBtn">Stop Sharing</button>

    <div class="status" id="status"></div>

    <div class="instructions">
      <h3>How it works</h3>
      <ol>
        <li>Share the code above with your viewer</li>
        <li>Click "Share Screen" and select what to share</li>
        <li>Viewer visits <code>[code].hyperframe.computer</code></li>
        <li>Direct peer-to-peer connection - no server in between</li>
      </ol>
    </div>
  </div>

  <script src="/sharer.js"></script>
</body>
</html>
