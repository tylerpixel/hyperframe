<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hyperframe. Accountless Screenshare.</title>
  <meta name="description" content="Peer-to-peer screen sharing. No downloads, no accounts.">
  <meta property="og:title" content="Hyperframe. Accountless Screenshare.">
  <meta property="og:description" content="Peer-to-peer screen sharing. No downloads, no accounts.">
  <meta property="og:image" content="https://hyperframe.computer/images/graph.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://hyperframe.computer">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Hyperframe. Accountless Screenshare.">
  <meta name="twitter:description" content="Peer-to-peer screen sharing. No downloads, no accounts.">
  <meta name="twitter:image" content="https://hyperframe.computer/images/graph.png">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="container">
    <div class="logo enter" style="--i:0"><a href="https://hyperframe.computer"><img src="/images/logo.svg" alt="Hyperframe"></a></div>

    <div class="hyperframe-code-pill interactive enter" style="--i:1" id="hyperframeCodePill" title="Click to copy">
      <span class="copy-hint" id="copyHint"></span>
      <span class="hyperframe-code" id="hyperframeCode">---</span>
    </div>
    <div class="hidden" id="hyperframeUrl"></div>

    <div class="actions enter" style="--i:2">
      <button class="btn interactive" id="shareBtn">Share Hyperframe</button>
      <button class="btn btn-stop interactive hidden" id="stopBtn">Stop Sharing</button>
      <div class="status" id="status"></div>
    </div>

    <a class="ad-ribbon interactive enter" style="--i:3" href="https://default.supply" target="_blank" rel="noopener">
      <div class="ad-ribbon-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </div>
      <div class="ad-ribbon-text">
        <span class="ad-ribbon-title">Default.Supply</span>
        <span class="ad-ribbon-subtitle">Design templates, by Default</span>
      </div>
      <span class="ad-ribbon-label">Ad</span>
    </a>
  </div>

  <script>document.body.classList.add('loaded');</script>
  <script src="/sharer.js"></script>
</body>
</html>
